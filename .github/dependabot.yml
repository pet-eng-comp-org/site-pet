# Padrão do PET para dependências (o mesmo em todos os repositórios):
# - semanal, às segundas;
# - minor e patch num PR por grupo; major sempre em PR próprio, para ser lido
#   e testado sozinho;
# - as correções de segurança vêm juntas num PR só.
# Mesclar um PR daqui passa pelo CI e, na branch principal, implanta.

version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    cooldown:
      # Versao nova so e proposta depois de 7 dias publicada: pacote
      # sequestrado costuma ser descoberto e retirado nesse prazo. Correcao
      # de seguranca nao espera (o cooldown nao vale para ela).
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      back-end-producao:
        dependency-type: production
        update-types: ["minor", "patch"]
      back-end-desenvolvimento:
        dependency-type: development
        update-types: ["minor", "patch"]
      back-end-seguranca:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @types/node acompanha o major do Node da imagem; tipo mais novo que o
      # runtime descreve API que não existe em execução.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      front-end-producao:
        dependency-type: production
        update-types: ["minor", "patch"]
      front-end-desenvolvimento:
        dependency-type: development
        update-types: ["minor", "patch"]
      front-end-seguranca:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @types/node acompanha o major do Node da imagem; tipo mais novo que o
      # runtime descreve API que não existe em execução.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    ignore:
      # Major do Node só quando a versão nova for LTS (a ímpar é Current) e de
      # propósito, num PR com teste. Patch e digest continuam entrando.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    ignore:
      # Major do Node só quando a versão nova for LTS (a ímpar é Current) e de
      # propósito, num PR com teste. Patch e digest continuam entrando.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      # Todas as actions num PR só, major inclusive: o CI do próprio PR testa o
      # workflow, e um PR por action enchia a lista (6 no site-pet de uma vez).
      actions:
        patterns: ["*"]
