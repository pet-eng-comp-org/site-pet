name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - infra/docker-node18
  # Em pull request os testes rodam e as imagens sao construidas sem publicar.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Testes de cenario do back-end (backend/test/): sobem a API contra um MongoDB e
  # conferem login, rotas do painel, o que as rotas publicas expoem e que
  # requisicao malformada nao derruba o processo. Falhou aqui, nada e publicado
  # nem implantado.
  testa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo:
        # Mesma linha do Atlas de producao (8.0), fixada por digest.
        image: mongo:8.0@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A versao da imagem (Dockerfile: node:18-alpine).
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          MONGO_URL_TESTE: mongodb://127.0.0.1:27017/sitepet_teste

  build:
    needs: testa
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: back-end
            context: ./backend
          - service: frontend
            image: front-end
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            ${{ (matrix.service == 'frontend' && vars.REACT_APP_API_URL != '') && format('REACT_APP_API_URL={0}', vars.REACT_APP_API_URL) || '' }}

      - name: Print published tags
        if: steps.meta.outputs.tags != ''
        run: echo "Published tags ${{ steps.meta.outputs.tags }}"

  # Publicar nao e implantar: quem implanta e o commit abaixo. O CI escreve o
  # digest recem-publicado no docker-compose.prod.yml e commita na main; o
  # Portainer acompanha este arquivo e aplica em ate 5 minutos.
  #
  # So troca o digest do servico cuja pasta mudou: build nunca repete digest, e
  # trocar os dois reiniciaria o backend por mudanca so no frontend. `git revert`
  # no commit de deploy volta a versao anterior; o push feito com GITHUB_TOKEN
  # nao dispara este workflow de novo.
  implanta:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: implanta

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escreve o digest novo no compose de producao
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Execucao antiga nao implanta por cima de uma mais nova: se entrou
          # commit de codigo depois deste (os do bot nao contam), a execucao
          # dele implanta.
          # Filtra pelo ASSUNTO: --invert-grep --grep testava cada linha da
          # mensagem, e um commit humano com "deploy:" no corpo passava por
          # commit do bot. O awk le tudo (sem exit): com pipefail, sair cedo
          # mataria o git log por SIGPIPE e derrubaria o job.
          novo=$(git log --format='%H%x09%s' "${GITHUB_SHA}..HEAD" | awk -F'\t' '!f && $2 !~ /^deploy:/ {print $1; f=1}')
          if [ -n "$novo" ]; then
            echo "Ha commit mais novo ($novo); a execucao dele implanta."; exit 0
          fi

          mudou=""
          # pasta do codigo:nome da imagem (sitepet/back-end, sitepet/front-end)
          for par in backend:back-end frontend:front-end; do
            servico=${par%%:*}
            img="ghcr.io/${GITHUB_REPOSITORY,,}/${par##*:}"
            # Compara com o commit que esta EM PRODUCAO (o :sha- anotado no
            # compose), nao com o push anterior: deploy que falhou ou foi
            # cancelado entra na proxima execucao em vez de se perder.
            ultimo=$(grep -oE "${img}:sha-[0-9a-f]+" docker-compose.prod.yml | head -1 | sed 's/.*:sha-//' || true)
            if [ "$EVENTO" = push ] && [ -n "$ultimo" ] && git cat-file -e "${ultimo}^{commit}" 2>/dev/null; then
              if ! git diff --name-only "$ultimo" "$GITHUB_SHA" | grep -q "^${servico}/"; then
                continue
              fi
            fi
            digest=$(docker buildx imagetools inspect "${img}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)
            # Digest vazio apagaria a imagem do compose e derrubaria o servico.
            if ! echo "$digest" | grep -qxE 'sha256:[0-9a-f]{64}'; then
              echo "Digest invalido para ${img}: '${digest}'"; exit 1
            fi
            sed -i -E "s#(${img})@sha256:[0-9a-f]+#\1@${digest}#; s#(${img}):sha-[0-9a-f]+#\1:sha-${GITHUB_SHA::7}#" docker-compose.prod.yml
            # Linha que nao casou (imagem renomeada, dono novo) nao pode passar em verde.
            if ! grep -qF "${img}@${digest}" docker-compose.prod.yml; then
              echo "A linha image: de ${img} nao foi encontrada no compose"; exit 1
            fi
            mudou="$mudou $servico"
          done

          if git diff --quiet -- docker-compose.prod.yml; then
            echo "Nada a implantar: nenhum servico mudou desde o que esta em producao."; exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "deploy:$mudou no commit ${GITHUB_SHA:0:8}

          Para reverter esta implantacao: git revert deste commit." -- docker-compose.prod.yml
          # Merge que entrou entre o checkout e o push: rebase e tenta de novo.
          for tentativa in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            sleep 5; git pull -q --rebase origin main
          done
          echo "O push do commit de deploy falhou 3 vezes"; exit 1
