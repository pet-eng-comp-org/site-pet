# O site inteiro na sua máquina, para testar antes de abrir a PR:
#
#   docker compose up --build -d
#
# Site em http://localhost:3000 (o mesmo servidor de produção) e API em
# http://localhost:3333. Painel: /login, com admin@pet.local e senha-local.
# O banco começa só com essa conta (dev/semente.js) e guarda o que você
# cadastrar entre uma subida e outra. Para começar do zero:
#
#   docker compose down -v
#
# Nada aqui vai para produção: a stack de lá é o docker-compose.prod.yml.

# Nome fixo: o mesmo banco, de qualquer pasta ou worktree.
name: sitepet-local

services:
  banco:
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    volumes:
      - banco:/data/db
      - ./dev/semente.js:/docker-entrypoint-initdb.d/semente.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 2s
      retries: 30

  back-end:
    build: ./backend
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DB_CONNECT: mongodb://banco:27017/sitepet
      TOKEN_SECRET: segredo-so-para-testar
      # 80, como em produção: é a porta do HEALTHCHECK do Dockerfile.
      PORT: 80
    volumes:
      - arquivos:/usr/app/uploads
    # As duas portas saem daqui porque o front-end usa a rede deste serviço.
    ports:
      - 127.0.0.1:3333:80
      - 127.0.0.1:3000:3000

  front-end:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3333/
    environment:
      PORT: 3000
    # A porta 80 desta rede é do back-end; o teste do Dockerfile olha a 80.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
    # Mesma rede do back-end: o endereço da API vai no build, e
    # localhost:3333 precisa responder tanto no navegador quanto no servidor
    # que monta as páginas.
    network_mode: service:back-end
    depends_on:
      back-end:
        condition: service_healthy

volumes:
  banco:
  arquivos:
