# PRODUCAO — este arquivo e a stack `site-pet` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda: **mexer aqui implanta**. As linhas `image:` quem escreve e o CI, a cada
# push na main (job `implanta` em build-and-push.yml).
#
# As variaveis (`$DB_CONNECT` etc.) sao referencias: os valores vivem na stack,
# dentro do Portainer, e nunca entram no git.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  back-end:
    container_name: site-pet_back-end
    # ghcr.io/pet-eng-comp-org/site-pet/back-end:sha-d009ac7
    image: ghcr.io/pet-eng-comp-org/site-pet/back-end@sha256:b42915cc11908343f5ebf091188c081684b3e2031c80a68a22a3a47883b3af2a
    logging: *logging
    restart: always
    environment:
      DB_CONNECT: $DB_CONNECT
      TOKEN_SECRET: $TOKEN_SECRET
      EMAIL: $EMAIL
      EMAIL_PASSWORD: $EMAIL_PASSWORD
      # 80 fixo: e a porta do HEALTHCHECK do Dockerfile e do Traefik abaixo.
      PORT: 80
    volumes:
      - back-end-public:/usr/app/public
      - back-end-uploads:/usr/app/uploads
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site-pet_back-end.rule=Host(`api.pet.inf.ufes.br`)"
      - "traefik.http.services.site-pet_back-end.loadbalancer.server.port=80"
      - "traefik.http.routers.site-pet_back-end.entrypoints=websecure"
      - "traefik.http.routers.site-pet_back-end.tls.certresolver=le"
      # Rotas publicas que nao pedem token: o login do painel, o contato (que
      # manda e-mail) e o envio de inscricao. O Traefik conta por IP e barra o
      # excesso antes de chegar ao back-end. A prioridade alta faz este
      # roteador ganhar do geral acima.
      - "traefik.http.routers.site-pet_back-end-publico.rule=Host(`api.pet.inf.ufes.br`) && (Path(`/api/login`) || Path(`/api/login/`) || (Method(`POST`) && PathRegexp(`^/api/(contact|inscriptions)/?$`)))"
      - "traefik.http.routers.site-pet_back-end-publico.priority=200"
      - "traefik.http.routers.site-pet_back-end-publico.entrypoints=websecure"
      - "traefik.http.routers.site-pet_back-end-publico.tls.certresolver=le"
      - "traefik.http.routers.site-pet_back-end-publico.service=site-pet_back-end"
      - "traefik.http.routers.site-pet_back-end-publico.middlewares=site-pet_limite-publico"
      - "traefik.http.middlewares.site-pet_limite-publico.ratelimit.average=10"
      - "traefik.http.middlewares.site-pet_limite-publico.ratelimit.period=1m"
      - "traefik.http.middlewares.site-pet_limite-publico.ratelimit.burst=10"
      - "traefik.docker.network=traefik"

  front-end:
    container_name: site-pet_front-end
    # ghcr.io/pet-eng-comp-org/site-pet/front-end:sha-77a5a43
    image: ghcr.io/pet-eng-comp-org/site-pet/front-end@sha256:6806c18566120ff81681da66c7bb90e3156bc2c7a349f36bfd2d76b8743e3fdf
    logging: *logging
    restart: always
    stdin_open: true
    depends_on:
      - back-end
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site-pet_front-end.rule=Host(`pet.inf.ufes.br`)"
      - "traefik.http.services.site-pet_front-end.loadbalancer.server.port=80"
      - "traefik.http.routers.site-pet_front-end.entrypoints=websecure"
      - "traefik.http.routers.site-pet_front-end.tls.certresolver=le"
      - "traefik.docker.network=traefik"

networks:
  # A rede e da stack do Traefik: apagar esta stack nao pode tentar remove-la.
  traefik:
    name: traefik
    external: true

# Externos: apagar ou recriar a stack nao leva as fotos e os uploads junto.
# Entram no backup noturno da VM.
# Padrao <stack>_<servico>-<conteudo> das stacks da VM; o conteudo e o nome da
# pasta do back-end que o volume guarda. Copiados em 10/10/2026 dos volumes da
# stack antiga (sitepet).
volumes:
  back-end-public:
    external: true
    name: site-pet_back-end-public
  back-end-uploads:
    external: true
    name: site-pet_back-end-uploads
