# PRODUCAO — este arquivo e a stack `sitepet` na VM do PET.
#
# O Portainer puxa este caminho deste repositorio e aplica sozinho quando ele
# muda: **mexer aqui implanta**. As linhas `image:` quem escreve e o CI, a cada
# push na main (job `implanta` em build-and-push.yml).
#
# As variaveis (`$DB_CONNECT` etc.) sao referencias: os valores vivem na stack,
# dentro do Portainer, e nunca entram no git.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    # ghcr.io/pet-eng-comp-org/sitepet-backend:sha-d0a612f
    image: ghcr.io/pet-eng-comp-org/sitepet-backend@sha256:b2ab4f2eabf8892a63c652fdbad52ebd27fd691b2c56649c19296ca14425c88c
    logging: *logging
    restart: always
    environment:
      DB_CONNECT: $DB_CONNECT
      TOKEN_SECRET: $TOKEN_SECRET
      EMAIL: $EMAIL
      EMAIL_PASSWORD: $EMAIL_PASSWORD
      # 80 fixo: e a porta do HEALTHCHECK do Dockerfile e do Traefik abaixo.
      PORT: 80
    volumes:
      - sitepetpublic:/usr/app/public
      - sitepetuploads:/usr/app/uploads
    deploy:
      replicas: 2
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sitepetbackend.rule=Host(`api.pet.inf.ufes.br`)"
      - "traefik.http.services.sitepetbackend.loadbalancer.server.port=80"
      - "traefik.http.routers.sitepetbackend.entrypoints=websecure"
      - "traefik.http.routers.sitepetbackend.tls.certresolver=le"
      - "traefik.docker.network=traefik"

  frontend:
    # ghcr.io/pet-eng-comp-org/sitepet-frontend:sha-d0a612f
    image: ghcr.io/pet-eng-comp-org/sitepet-frontend@sha256:bf1c460b058d6a77ab1882c5b6be04791863089605a0e3672d2acb544c1fc06f
    logging: *logging
    restart: always
    stdin_open: true
    depends_on:
      - backend
    deploy:
      replicas: 2
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sitepetfrontend.rule=Host(`pet.inf.ufes.br`)"
      - "traefik.http.services.sitepetfrontend.loadbalancer.server.port=80"
      - "traefik.http.routers.sitepetfrontend.entrypoints=websecure"
      - "traefik.http.routers.sitepetfrontend.tls.certresolver=le"
      - "traefik.docker.network=traefik"

networks:
  # A rede e da stack do Traefik: apagar esta stack nao pode tentar remove-la.
  traefik:
    name: traefik
    external: true

# Externos: apagar ou recriar a stack nao leva as fotos e os uploads junto.
# Entram no backup noturno da VM.
volumes:
  sitepetpublic:
    external: true
    name: sitepet_sitepetpublic
  sitepetuploads:
    external: true
    name: sitepet_sitepetuploads
